[project]
name = "paper-radar-extraction"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "docling==2.137.0",
    "PyMuPDF==1.28.2",
    "Pillow==12.0.0",
    "pytesseract==0.3.13",
    "requests==2.34.2",
]

[project.scripts]
paper-radar-clean-read = "paper_radar_extraction.clean_read:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
