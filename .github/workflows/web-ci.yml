name: web-ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/docling
            ~/.cache/huggingface/hub
          key: docling-models-${{ runner.os }}-v1
      - run: pnpm test:js
      - run: pnpm test:python
      - run: pnpm test:extraction
        env:
          CLEAN_READ_FIXTURE: "1"
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @paper-radar/web exec playwright install --with-deps chromium
      - run: pnpm --filter @paper-radar/web exec playwright test --config ../../playwright.config.ts
