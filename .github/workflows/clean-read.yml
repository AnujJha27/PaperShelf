name: clean-read

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clean-read-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/docling
            ~/.cache/huggingface/hub
          key: docling-models-${{ runner.os }}-v1
      - name: Install local OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
      - name: Install pinned extraction project
        run: uv sync --project services/extraction --locked
      - name: Check extraction and representative PDF fixture
        working-directory: services/extraction
        run: uv run --locked pytest -q -v
        env:
          CLEAN_READ_FIXTURE: "1"
      - name: Process requested Clean Read job
        working-directory: services/extraction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run --locked paper-radar-clean-read --job-id "${{ inputs.job_id }}"
